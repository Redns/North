<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg" href="icons/favicon.svg" />
    <link href="North.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet" />
    <!-- Important: Increment the version parameter whenever you update MudBlazor to prevent caching issues -->
    <link href="_content/MudBlazor/MudBlazor.min.css?v=1" rel="stylesheet" />
    <meta name="color-scheme" content="light dark" />
    <style>
        html {
            background-color: #f7f9fc;
        }

        html[data-theme-dark="true"] {
            background-color: #32333d;
        }
    </style>
    <script>
        window.northTheme = {
            apply: function (themeMode, isDarkMode) {
                var root = document.documentElement;
                var body = document.body;

                root.dataset.themeMode = themeMode || "System";
                root.dataset.themeDark = isDarkMode ? "true" : "false";

                if (body) {
                    body.dataset.themeMode = root.dataset.themeMode;
                    body.dataset.themeDark = root.dataset.themeDark;
                }
            }
        };

        (function () {
            var themeMode = localStorage.getItem("ThemeMode") || "System";
            var isSystemDarkMode = window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches;
            var isDarkMode = themeMode === "Dark" || (themeMode === "System" && isSystemDarkMode);

            window.northTheme.apply(themeMode, isDarkMode);
        })();
    </script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-container">
            <img src="icons/loading.svg" class="loading-spinner" alt="Loading..." />
            <div class="loading-progress-bar">
                <div class="loading-progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/Toolbelt.Blazor.PWA.Updater.Service/script.min.js"></script>
    <!-- Important: Increment the version parameter whenever you update MudBlazor to prevent caching issues -->
    <script src="_content/MudBlazor/MudBlazor.min.js?v=1"></script>
</body>

</html>
